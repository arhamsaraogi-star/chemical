# History backfill on GitHub's runners (open internet). Runs when .github/backfill.trigger changes
# on any branch, or on demand. Results are validated by the safe runner and committed back to the
# same branch; nothing is deployed from here.
name: backfill
on:
  push:
    paths: [".github/backfill.trigger"]
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated source ids (default: baiinfo_wayback)"
        default: "baiinfo_wayback"
permissions:
  contents: write
concurrency:
  group: backfill-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill
        env:
          SOURCES: ${{ inputs.sources || 'baiinfo_wayback' }}
        run: |
          args=""
          for s in $SOURCES; do args="$args --source $s"; done
          python -u -m chem_monitor.cli collect --backfill $args
          python -c "import json; print(json.dumps(json.load(open('data/status/source_status.json')), indent=1, ensure_ascii=False))"
      - name: Tests
        run: python -m pytest -q tests
      - name: Rebuild site data
        run: python -m chem_monitor.cli build
      - name: Commit results to this branch
        run: |
          git config user.name "chem-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations data/status site/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: backfill $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
