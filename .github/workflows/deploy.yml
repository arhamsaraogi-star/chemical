# Publishes site/ by pushing the built site to the `gh-pages` branch
# (Settings -> Pages -> Deploy from a branch: gh-pages / root). No environment rules involved.
name: deploy
on:
  push:
    branches: [main]
    paths: ["site/**", "chem_monitor/**", "data/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Pull latest data commit (when called after a data update)
        run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Build site data from the committed CSV store
        run: python -m chem_monitor.cli build
      - run: touch site/.nojekyll
      - name: Publish to gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "chem-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site build $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
