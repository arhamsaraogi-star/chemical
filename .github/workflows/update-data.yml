# Scheduled data engine: collect -> validate -> rebuild -> test -> commit -> deploy.
# Runs on the default branch only (GitHub schedules always do). A failing source never erases data.
name: update-data
on:
  schedule:
    - cron: "37 2 * * 1-5"    # 10:37 China time, after Baiinfo's morning notes
    - cron: "37 10 * * 1-5"   # 18:37 China time, catches late notes / NBS releases
  workflow_dispatch:
    inputs:
      backfill:
        description: "Run history backfill collectors (NBS, Comtrade, Internet Archive)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-and-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect (live)
        run: python -m chem_monitor.cli collect
      - name: Collect (backfill)
        if: ${{ inputs.backfill }}
        run: python -m chem_monitor.cli collect --backfill
      - name: Tests (must pass before anything is published)
        run: python -m pytest -q tests
      - name: Rebuild analytics and site data
        run: python -m chem_monitor.cli build
      - name: Commit data snapshot if changed
        id: commit
        run: |
          git config user.name "chem-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations data/status site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
