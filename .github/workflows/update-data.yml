# Scheduled data engine: collect -> validate -> rebuild -> test -> commit -> deploy.
# Runs on the default branch only (GitHub schedules always do). A failing source never erases data.
name: update-data
on:
  schedule:
    - cron: "37 2 * * *"      # daily 10:37 China time, after Baiinfo's morning notes
    - cron: "37 10 * * 1-5"   # weekdays 18:37 China time, catches late notes / NBS releases
  workflow_dispatch:
    inputs:
      backfill:
        description: "Run history backfill collectors (NBS, Comtrade, Internet Archive)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: data-and-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect (live)
        run: python -m chem_monitor.cli collect
      - name: Collect (backfill)
        if: ${{ inputs.backfill }}
        run: python -m chem_monitor.cli collect --backfill
      - name: Tests (must pass before anything is published)
        run: python -m pytest -q tests
      - name: Keep yesterday's summary for the change digest
        run: |
          mkdir -p /tmp/prev
          cp site/data/hacid/summary.json /tmp/prev/summary.json 2>/dev/null || echo '{}' > /tmp/prev/summary.json
      - name: Rebuild analytics and site data
        run: python -m chem_monitor.cli build
      - name: Notify on changes (comment on the "Daily H-Acid updates" issue)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python -m chem_monitor.notify /tmp/prev/summary.json site/data/hacid/summary.json \
            site/data/hacid/inflections.json site/data/sources.json /tmp/digest.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Daily H-Acid updates"' --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Daily H-Acid updates" \
              --body "@$OWNER The monitor runs every day and comments here whenever the H-Acid price, cycle state, drivers or a data source change. GitHub e-mails you each comment. Live site: https://arhamsaraogi-star.github.io/chemical/"
            n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Daily H-Acid updates"' --json number --jq '.[0].number')
          fi
          if [ -s /tmp/digest.md ]; then
            printf '\n\n@%s' "$OWNER" >> /tmp/digest.md
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file /tmp/digest.md
          fi
      - name: Commit data snapshot if changed
        id: commit
        run: |
          git config user.name "chem-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations data/status site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
